[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netslider"
version = "0.2.0"
description = "netSlider Protocol Laboratory — research lab for undocumented TCP binary protocols"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6,<7",
  "pyshark>=0.6",
  "pandas>=2.1",
  "click>=8.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
netslider = "netslider.app.main:main"
netslider-cli = "netslider.cli.main:cli"
netslider-demo-corpus = "netslider.demo.corpus.generate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netslider*"]

[tool.setuptools.package-data]
netslider = [
  "demo/corpus/*.pcap",
  "demo/corpus/*.json",
  "demo/corpus/defects/*.pcap",
  "demo/corpus/interpretations/*",
  "demo/corpus/golden/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
